<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<!-- Move Remote bridge: an https page (RemoteFM1) opens this plain-http window, which opens ws://<this host>/ws
     (same origin, no mixed content) and relays it over postMessage. Protocol in docs/PROTOCOL.md, "The bridge". -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move Remote bridge</title>
<style>
  :root { --bg:#16171a; --panel:#202228; --line:#33363e; --fg:#e8e8ea; --dim:#8a8d96; --acc:#5fd3a4; --warn:#f2b84b; --bad:#ef6b6b; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.3 -apple-system, system-ui, sans-serif;
         display:flex; align-items:center; justify-content:center; }
  main { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px 28px; margin:16px;
         max-width:420px; width:100%; box-sizing:border-box; text-align:center; }
  h1 { font-size:20px; font-weight:600; margin:0 0 18px; }
  #st { font-size:34px; font-weight:700; letter-spacing:.02em; color:var(--dim); }
  #st.open { color:var(--acc); } #st.wait { color:var(--warn); } #st.bad { color:var(--bad); }
  #n { margin-top:14px; color:var(--dim); font:14px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<main>
  <h1 id="h">Bridge to RemoteFM1 — keep this window open</h1>
  <div id="st" class="wait">waiting</div>
  <div id="n"></div>
</main>
<script>
(() => {
  "use strict";
  const FIXED = ["https://remotefm1.com", "https://www.remotefm1.com"];
  const LOOP = /^http:\/\/(localhost|127\.0\.0\.1|\[::1\])(:\d{1,5})?$/;
  const st = document.getElementById("st"), cnt = document.getElementById("n");
  const opener = window.opener;
  let extra = null;
  try {
    const o = new URLSearchParams(location.search).get("origin");
    if (o) {
      const u = new URL(o), norm = u.origin;
      if (norm === o.replace(/\/$/, "") && (u.protocol === "https:" || LOOP.test(norm))) extra = norm;
    }
  } catch (_) {}
  const allowed = (o) => FIXED.includes(o) || LOOP.test(o) || (extra !== null && o === extra);

  const show = (text, cls) => { st.textContent = text; st.className = cls; };
  if (!opener) {
    document.getElementById("h").textContent = "Open this from the RemoteFM1 site";
    show("not connected", "bad");
    return;
  }

  let peer = null, ws = null, rx = 0, tx = 0, rxb = 0, txb = 0;
  const count = () => { cnt.textContent = `in ${rx} · ${rxb} B   out ${tx} · ${txb} B`; };
  const post = (msg, transfer) => { if (peer) try { opener.postMessage(msg, peer, transfer || []); } catch (_) {} };

  function wsClose() {
    if (!ws) return;
    const w = ws; ws = null;
    w.onopen = w.onmessage = w.onerror = w.onclose = null;
    try { w.close(); } catch (_) {}
  }
  function wsOpen() {
    wsClose();
    show("connecting", "wait");
    const w = new WebSocket(`ws://${location.host}/ws`);
    w.binaryType = "arraybuffer";
    ws = w;
    w.onopen = () => { if (ws === w) { show("connected", "open"); post({ mr: "open" }); } };
    w.onmessage = (e) => {
      if (ws !== w || !(e.data instanceof ArrayBuffer)) return;
      rx++; rxb += e.data.byteLength; count();
      post({ mr: "data", data: e.data }, [e.data]);
    };
    w.onerror = () => { if (ws === w) post({ mr: "error" }); };
    w.onclose = (e) => {
      if (ws !== w) return;
      ws = null;
      show("closed", "bad");
      post({ mr: "close", code: e.code, reason: e.reason });
    };
  }
  function quit() { wsClose(); window.close(); }

  window.addEventListener("message", (e) => {
    if (e.source !== opener || !allowed(e.origin)) return;
    if (peer === null) peer = e.origin;
    else if (e.origin !== peer) return;
    const m = e.data;
    if (!m || typeof m !== "object" || typeof m.mr !== "string") return;
    if (m.mr === "open") wsOpen();
    else if (m.mr === "send") {
      if (ws && ws.readyState === WebSocket.OPEN && m.data instanceof ArrayBuffer) {
        ws.send(m.data); tx++; txb += m.data.byteLength; count();
      }
    } else if (m.mr === "close") quit();
  });

  for (const o of extra && !FIXED.includes(extra) ? FIXED.concat(extra) : FIXED) {
    try { opener.postMessage({ mr: "hello", v: 1 }, o); } catch (_) {}
  }
  setInterval(() => { if (opener.closed) quit(); }, 1000);
  count();
})();
</script>
</body>
</html>
